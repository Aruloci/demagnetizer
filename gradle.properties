# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
mod_version = 0.1.0-beta.1
maven_group = com.aruloci.demagnetizer
archives_name = demagnetizer
enabled_platforms = fabric,neoforge

# Minecraft properties
minecraft_version = 1.21.1

# Dependencies
fabric_loader_version = 0.19.5
fabric_api_version = 0.116.17+1.21.1
neoforge_version = 21.1.248

# Sophisticated Core / Backpacks - resolved from the Modrinth maven (maven.modrinth:<project id>:<version number>)
# 9jxwkYQL = Sophisticated Core (Unofficial Fabric port), ouNrBQtq = Sophisticated Backpacks (Unofficial Fabric port)
# ohNO6lps = Forge Config API Port (required at runtime by the Core Fabric port)
sophisticatedcore_fabric_version = 1.21.1-1.2.9.21.168
sophisticatedbackpacks_fabric_version = 1.21.1-3.23.4.3.106
forgeconfigapiport_version = v21.1.6-1.21.1-Fabric
sophisticatedcore_neoforge_version = 1.21.1-1.5.1.2341
sophisticatedbackpacks_neoforge_version = 1.21.1-3.26.3.2158

# Jar-in-jar libraries of the Sophisticated Core Fabric port. Loom strips nested jars from dependency
# mods (they are intermediary-mapped), so the Fabric dev run has to declare them explicitly.
porting_lib_version = 3.1.0-beta.47+1.21.1
teamreborn_energy_version = 4.1.0
# Same for Forge Config API Port, which nests NightConfig.
nightconfig_version = 3.8.0

# Tests
junit_version = 5.11.4
